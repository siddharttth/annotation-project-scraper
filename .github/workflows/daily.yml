name: daily annotation digest

on:
  schedule:
    # Target: in the inbox by 08:00 IST. GitHub's scheduler is best-effort and
    # has been starting this account's jobs about 6 hours late, so the trigger
    # is set for 02:00 IST (20:30 UTC the day before). On a day GitHub runs it
    # on time the mail simply arrives early. Repeats are impossible either way:
    # seen.json records what was already sent.
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip the email, just build the digest artifact"
        type: boolean
        default: false

concurrency:
  group: annotation-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Restore the record of what was already mailed
        # Cache entries are immutable, so the key is unique per run and
        # restore-keys pulls the most recent one forward.
        uses: actions/cache@v4
        with:
          path: seen.json
          key: annotation-seen-${{ github.run_id }}
          restore-keys: |
            annotation-seen-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m scraper run
          else
            python -m scraper run --send
          fi

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore
